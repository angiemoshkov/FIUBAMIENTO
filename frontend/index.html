<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>

            <div id="titulo">
                <span class="texto-titulo">FIUBAMIENTO</span>
            </div>

            <button id="btn-activar-creacion">Agregar nuevo Spot</button>
            <a id="btn-historial" href="reportes.html">Historial de Reportes</a>

            <template id="nuevo-spot-template">
                <div class="spot-popup formulario-creacion">
                    <h4 class="titulo-creacion">Registrar Nuevo Punto</h4>
                    
                    <div class="grupo-input">
                        <label class="label-creacion" for="ins-direccion">Dirección aproximada:</label>
                        <input type="text" id="ins-direccion" placeholder="Ej. Av. Paseo Colón 850" class="input-creacion" required>
                    </div>
                    
                    <div class="grupo-input">
                        <label class="label-creacion" for="ins-referencia">Referencia / Descripción:</label>
                        <input type="text" id="ins-referencia" placeholder="Ej. Cerca de la entrada principal" class="input-creacion" required>
                    </div>
                    
                    <div class="container-acciones">
                        <!-- Cambiado de <a> a <button> para garantizar compatibilidad con JS y Leaflet -->
                        <button type="button" id="btn-guardar-spot" class="btn-guardar">Guardar Punto</button>
                    </div>
                </div>
            </template>

            <template id="editar-spot-template">
                <div class="spot-popup formulario-creacion">
                    <h4 class="titulo-creacion">Editar Punto</h4>

                    <p class="aviso-movido">Moviste el punto. Al guardar se borran sus reportes y restricciones, y vuelve a "sin información reciente".</p>

                    <div class="grupo-input">
                        <label class="label-creacion">Dirección aproximada:</label>
                        <input type="text" placeholder="Ej. Av. Paseo Colón 850" class="input-creacion edit-direccion" required>
                    </div>

                    <div class="grupo-input">
                        <label class="label-creacion">Referencia / Descripción:</label>
                        <input type="text" placeholder="Ej. Cerca de la entrada principal" class="input-creacion edit-referencia" required>
                    </div>

                    <div class="container-acciones">
                        <button type="button" class="btn-mover">Mover en el mapa</button>
                    </div>

                    <div class="container-acciones">
                        <button type="button" class="btn-guardar btn-guardar-edicion">Guardar cambios</button>
                    </div>
                </div>
            </template>

        </header>
        <main>

            <div id="map"></div>

            <template id="popup-template">
                <div class="spot-popup">
                    <p class="popup-direccion"></p>
                    <p class="popup-referencia"></p>
                    <p class="popup-estado">Estado: <strong></strong></p>
                    
                    <hr class="popup-divider">

                    <div class="container-acciones">
                        <a class="btn-marcar-libre" href="#">Libre</a>
                        <a class="btn-marcar-ocupado" href="#">Ocupado</a>
                    </div>
                    
                    <div class="popup-botones">
                        <a class="btn-restricciones" href="#">Restricciones</a>
                        <a class="btn-editar" href="#">Editar</a>
                        <a class="btn-eliminar" href="#">Eliminar</a>
                        <a class="btn-maps" target="_blank" href="#">Como llegar</a>
                    </div>
                </div>
            </template>

        </main>

        <div id="modal-confirmar" class="modal">
            <div class="modal-background"></div>
            <div class="modal-card">
                <header class="modal-card-head">
                    <p class="modal-card-title">Confirmar eliminación</p>
                </header>
                <section class="modal-card-body">
                    ¿Seguro que querés eliminar este spot? También se van a borrar sus reportes y restricciones.
                </section>
                <footer class="modal-card-foot">
                    <button class="button is-danger" id="btn-confirmar-eliminar">Eliminar</button>
                    <button class="button" id="btn-cancelar-eliminar">Cancelar</button>
                </footer>
            </div>
        </div>

        <footer>
        </footer>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="js/mapa.js"></script>
    </body>

</html>
