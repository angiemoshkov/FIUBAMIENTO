<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>

            <div id="titulo">
                <span class="texto-titulo">FIUBAMIENTO</span>
                <button id="btn-activar-creacion"> + </button>
            </div>

            <template id="popup-template">
                <div class="spot-popup">
                    <h3 class="popup-direccion">Cargando dirección...</h3>
                    
                    <p class="popup-estado">Estado actual: <strong>Cargando...</strong></p>
                    
                    <div class="popup-acciones-rapidas">
                        <button class="btn-accion btn-marcar-libre">Marcar Libre</button>
                        <button class="btn-accion btn-marcar-ocupado">Marcar Ocupado</button>
                    </div>

                    <div class="popup-enlaces">
                        <a href="#" target="_blank" class="btn-maps">¿Cómo llegar?</a>
                        <a href="#" class="btn-ver-reportes">Historial de Reportes</a>
                    </div>
                </div>
            </template>

        </header>
        <main>

            <div id="map"></div>

            <template id="popup-template">
                <div class="spot-popup">
                    <p class="popup-direccion"></p>
                    <p class="popup-estado">Estado: <strong></strong></p>
                    
                    <hr class="popup-divider">

                    <!-- Contenedor flex con las etiquetas de tus enlaces originales -->
                    <div class="container-acciones">
                        <a class="btn-marcar-libre btn-maps" href="#">Libre</a>
                        <a class="btn-marcar-ocupado id btn-restricciones" href="#">Ocupado</a>
                    </div>
                    
                    <div class="popup-botones">
                        <a class="btn-ver-reportes btn-restricciones" href="#">Ver reportes</a>
                        <a class="btn-maps" target="_blank" href="#">Cómo llegar</a>
                    </div>
                </div>
            </template>

        </main>
        <footer>
        </footer>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="js/reportes.js"></script>
        <script src="js/mapa.js"></script>
    </body>

</html>
