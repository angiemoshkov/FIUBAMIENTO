<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <header>

            <div id="titulo">
                <span class="texto-titulo">FIUBAMIENTO</span>
                <button id="btn-activar-creacion"> + </button>
            </div>

            <a id="btn-historial" href="reportes.html">Historial de Reportes</a>

            <template id="nuevo-spot-template">
                <div class="spot-popup formulario-creacion">
                    <h4 class="titulo-creacion">Registrar Nuevo Punto</h4>
                    
                    <div class="grupo-input">
                        <label class="label-creacion" for="ins-direccion">Dirección aproximada:</label>
                        <input type="text" id="ins-direccion" placeholder="Ej. Av. Paseo Colón 850" class="input-creacion" required>
                    </div>
                    
                    <div class="grupo-input">
                        <label class="label-creacion" for="ins-referencia">Referencia / Descripción:</label>
                        <input type="text" id="ins-referencia" placeholder="Ej. Cerca de la entrada principal" class="input-creacion" required>
                    </div>
                    
                    <div class="container-acciones">
                        <!-- Cambiado de <a> a <button> para garantizar compatibilidad con JS y Leaflet -->
                        <button type="button" id="btn-guardar-spot" class="btn-guardar">Guardar Punto</button>
                    </div>
                </div>
            </template>

        </header>
        <main>

            <div id="map"></div>

            <template id="popup-template">
                <div class="spot-popup">
                    <p class="popup-direccion"></p>
                    <p class="popup-estado">Estado: <strong></strong></p>
                    
                    <hr class="popup-divider">

                    <div class="container-acciones">
                        <a class="btn-marcar-libre" href="#">Libre</a>
                        <a class="btn-marcar-ocupado" href="#">Ocupado</a>
                    </div>
                    
                    <div class="popup-botones">
                        <a class="btn-restricciones" href="#">Restricciones</a>
                        <a class="btn-editar" href="#">Editar</a>
                        <a class="btn-eliminar" href="#">Eliminar</a>
                        <a class="btn-maps" target="_blank" href="#">Como llegar</a>
                    </div>
                </div>
            </template>

        </main>
        <footer>
        </footer>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
        <script src="js/mapa.js"></script>
    </body>

</html>
