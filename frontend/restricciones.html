<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <section class="section">
        <div class="container">
            <a href="index.html" class="button mb-4">← Volver al mapa</a>
            <h1 class="title" id="titulo-pagina">Restricciones de estacionamiento</h1>

            <!-- Tabla -->
            <table class="table is-fullwidth is-striped mt-4">
                <thead>
                    <tr>
                        <th>Dirección</th>
                        <th>Tipo</th>
                        <th>Día</th>
                        <th>Hora inicio</th>
                        <th>Hora fin</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="body-restricciones">
                    <tr><td colspan="7">Cargando restricciones...</td></tr>
                </tbody>
            </table>

            <button class="button is-primary mt-3" onclick="mostrarFormulario()">+ Agregar restricción</button>

            <!-- Formulario crear/editar (oculto por defecto) -->
            <div class="box mt-5" id="formulario-restriccion" style="display:none">
                <h2 class="subtitle" id="form-titulo">Agregar restricción</h2>
                <input type="hidden" id="restriccion-id">
                <input type="hidden" id="form-spot-id">
                <div class="field">
                    <label class="label">Tipo</label>
                    <input class="input" type="text" id="form-tipo" placeholder="Ej: carga_descarga">
                </div>
                <div class="field">
                    <label class="label">Día de la semana</label>
                    <div class="select is-fullwidth">
                        <select id="form-dia">
                            <option value="">-- Seleccioná un día --</option>
                            <option value="1">Lunes</option>
                            <option value="2">Martes</option>
                            <option value="3">Miércoles</option>
                            <option value="4">Jueves</option>
                            <option value="5">Viernes</option>
                            <option value="6">Sábado</option>
                            <option value="7">Domingo</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label class="label">Hora inicio</label>
                    <input class="input" type="time" id="form-hora-inicio">
                </div>
                <div class="field">
                    <label class="label">Hora fin</label>
                    <input class="input" type="time" id="form-hora-fin">
                </div>
                <div class="field">
                    <label class="label">Descripción (opcional)</label>
                    <input class="input" type="text" id="form-descripcion" placeholder="Ej: Prohibido estacionar días hábiles">
                </div>
                <div class="field is-grouped">
                    <div class="control">
                        <button class="button is-success" onclick="guardarRestriccion()">Guardar</button>
                    </div>
                    <div class="control">
                        <button class="button is-light" onclick="ocultarFormulario()">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal de confirmación -->
    <div id="modal-confirmar" class="modal">
        <div class="modal-background"></div>
        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title">Confirmar eliminación</p>
            </header>
            <section class="modal-card-body">
                ¿Seguro que querés eliminar esta restricción?
            </section>
            <footer class="modal-card-foot">
                <button class="button is-danger" id="btn-confirmar-eliminar">Eliminar</button>
                <button class="button" id="btn-cancelar-eliminar">Cancelar</button>
            </footer>
        </div>
    </div>

    <script src="js/restricciones.js"></script>
</body>
</html>
