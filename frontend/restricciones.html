<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <section class="section">
        <div class="container">
            <h1 class="title">Restricciones de estacionamiento</h1>

            <div class="field">
                <label class="label">Filtrar por Spot ID</label>
                <div class="control">
                    <input class="input" type="number" id="spot-id-input" placeholder="Ej: 1">
                </div>
            </div>
            <button class="button is-primary" onclick="buscarRestricciones()">Buscar</button>

            <table class="table is-fullwidth is-striped mt-4" id="tabla-restricciones">
                <thead>
                    <tr>
                        <th>Spot ID</th>
                        <th>Tipo</th>
                        <th>Día</th>
                        <th>Hora inicio</th>
