<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Reportes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/reportes.css">
</head>
<body>
    <section class="section pt-4">
        <div class="container">
            <a href="index.html" class="button mb-4">← Volver al mapa</a>
            <h1 class="title">Historial de Reportes</h1>
            <p class="subtitle">Foto en tiempo real de todos los reportes cargados</p>

            <table class="table is-fullwidth is-striped mt-6">
                <thead>
                    <tr>
                        <th>Dirección</th>
                        <th>Estado reportado</th>
                        <th>Estado actual</th>
                        <th>Veces libre</th>
                        <th>Veces ocupado</th>
                        <th>Creado</th>
                        <th>Expira</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="body-reportes"></tbody>
            </table>
        </div>
    </section>

    <div id="modal-confirmar" class="modal">
        <div class="modal-background"></div>
        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title">Confirmar eliminación</p>
            </header>
            <section class="modal-card-body">
                ¿Seguro que querés eliminar este reporte?
            </section>
            <footer class="modal-card-foot">
                <button class="button is-danger" id="btn-confirmar-eliminar">Eliminar</button>
                <button class="button" id="btn-cancelar-eliminar">Cancelar</button>
            </footer>
        </div>
    </div>

    <script src="js/reportes.js"></script>
</body>
</html>
